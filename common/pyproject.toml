[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "common"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["common*"]